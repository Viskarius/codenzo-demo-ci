name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    name: Линтер и тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: checks
    if: github.ref == 'refs/heads/main'

    env:
      DEPLOY_PATH: /var/www/codenzo-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Создать каталог деплоя
        run: |
          ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p $DEPLOY_PATH"

      - name: Деплой статических файлов
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/deploy_key" \
            public/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$DEPLOY_PATH/
