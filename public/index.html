<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codenzo CI/CD demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        max-width: 760px;
        margin: 48px auto;
        padding: 0 16px;
        color: #111;
      }

      .card {
        border: 1px solid #ddd;
        border-radius: 16px;
        padding: 24px;
      }

      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #eef7ee;
        color: #1c7c31;
        font-size: 14px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">CI/CD demo</div>
      <h1>Маркетплейс репетиторов по программированию</h1>
      <p id="greeting">Загрузка...</p>
      <p>
        Эта страница автоматически деплоится через GitHub Actions на VPS. Версия 2.
      </p>
    </main>

    <script type="module">
      import { getGreeting } from './src/greeting.js';

      const greetingElement = document.getElementById('greeting');
      greetingElement.textContent = getGreeting('юный разработчик');
    </script>
  </body>
</html>
